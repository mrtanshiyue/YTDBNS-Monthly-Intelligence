name: UI Integrity

on:
  push:
    branches:
      - mobile-a5-period-sheet-focus-rerender

permissions:
  contents: write

jobs:
  static-ui-integrity:
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message == 'Test run A5 focus patch' }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Apply and commit narrow A5 focus patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('public/mobile/mobile-vnext.js')
          text = p.read_text()
          old = "    const previousFocus = document.activeElement;\n    const searchFocused = previousFocus?.matches?.('[data-vnext-search-input]');"
          new = "    const previousFocus = document.activeElement;\n    const searchFocused = previousFocus?.matches?.('[data-vnext-search-input]');\n    const periodSheetCloseFocused = previousFocus?.matches?.('.vnext-sheet [data-vnext-close-sheet]');"
          text = replace_once(text, old, new, 'render focus capture')
          old = "    requestAnimationFrame(() => {\n      if (searchFocused || state.tab === 'search' && document.documentElement.dataset.vnextAutofocus === 'true') {"
          new = "    requestAnimationFrame(() => {\n      if (periodSheetCloseFocused && state.sheet === 'period') {\n        root.querySelector('.vnext-sheet [data-vnext-close-sheet]')?.focus({ preventScroll: true });\n      }\n      if (searchFocused || state.tab === 'search' && document.documentElement.dataset.vnextAutofocus === 'true') {"
          text = replace_once(text, old, new, 'render focus restore')
          p.write_text(text)

          p = Path('scripts/mobile-a5-period-sheet-reload-acceptance.mjs')
          text = p.read_text()
          anchor = "  expect(\n    !source.includes('localStorage.') && !source.includes('sessionStorage.'),\n    'A5 static contract: Reload continuity adds no browser-storage dependency'\n  );"
          added = "  expect(\n    source.includes('periodSheetCloseFocused') &&\n      source.includes(\"root.querySelector('.vnext-sheet [data-vnext-close-sheet]')?.focus({ preventScroll: true })\"),\n    'A5 static contract: rerenders preserve focus only when the reconstructed period-sheet close control owned focus'\n  );\n" + anchor
          text = replace_once(text, anchor, added, 'A5 static focus contract')
          anchor = "    expect(evidence.afterReload.closeFocused, `${label}/reload: reconstructed dialog owns initial focus`, JSON.stringify(evidence.afterReload));\n\n    await page.goBack({ waitUntil: 'load' }).catch(() => null);"
          added = "    expect(evidence.afterReload.closeFocused, `${label}/reload: reconstructed dialog owns initial focus`, JSON.stringify(evidence.afterReload));\n\n    await page.evaluate(() => window.YT_SHARED_RUNTIME?.refresh?.());\n    await waitReady(page);\n    await waitSheet(page);\n    evidence.afterRuntimeRefresh = await snapshot(page);\n    expectSheet(evidence.afterRuntimeRefresh, `${label}/runtime-refresh`, expected);\n    expect(evidence.afterRuntimeRefresh.closeFocused, `${label}/runtime-refresh: live-style runtime rerender preserves reconstructed dialog focus`, JSON.stringify(evidence.afterRuntimeRefresh));\n\n    await page.goBack({ waitUntil: 'load' }).catch(() => null);"
          text = replace_once(text, anchor, added, 'A5 runtime refresh acceptance')
          p.write_text(text)
          PY
          node --check public/mobile/mobile-vnext.js
          node --check scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          git diff --check
          git diff -- public/mobile/mobile-vnext.js scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mobile/mobile-vnext.js scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          git commit -m 'Mobile A5: preserve period-sheet focus across rerenders'
          git push origin HEAD:mobile-a5-period-sheet-focus-rerender
