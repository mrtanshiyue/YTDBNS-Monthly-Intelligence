name: UI Integrity

on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'README.md'
      - 'V5_MOBILE_ARCHITECTURE.md'
      - 'DEPLOYMENT_HANDOFF.md'
      - '.github/workflows/ui-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-ui-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check public/current-ui.js
          node --check public/mobile/mobile-shell.js
          node --check public/mobile/mobile-compare.js
          node --check public/mobile/mobile-interactions.js
          node --check scripts/ui-integrity-static-check.mjs
          node --check scripts/v5-native-mobile-static-check.mjs
      - name: Desktop + Native Mobile static release gate
        run: npm run check:release:static
