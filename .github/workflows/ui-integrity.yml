name: UI Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-ui-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: P1 null metric semantics
        run: node scripts/p1-null-metric-semantics-check.mjs
      - name: JavaScript syntax
        run: npm run check
      - name: Desktop + Native Mobile static release gate
        run: npm run check:ui
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: A1 Period Sheet focus
        run: node scripts/mobile-a1-period-sheet-focus-acceptance.mjs
      - name: A1 Period Selection focus
        run: node scripts/mobile-a1-period-selection-focus-acceptance.mjs
      - name: Current Mobile IA Chromium
        run: node scripts/mobile-vnext-ia-acceptance.mjs
      - name: Mobile first-screen Chromium
        run: node scripts/mobile-a1-first-screen-acceptance.mjs
      - name: A1 narrow-screen
        run: node scripts/mobile-a1-narrow-screen-acceptance.mjs
      - name: A1 active-rail
        run: node scripts/mobile-a1-active-rail-acceptance.mjs
      - name: A1 three-fact
        run: node scripts/mobile-a1-three-fact-grid-acceptance.mjs
      - name: A1 fact-label
        run: node scripts/mobile-a1-fact-label-wrap-acceptance.mjs
      - name: A1 active-filter
        run: node scripts/mobile-a1-active-filter-acceptance.mjs
      - name: A1 primary-tab focus
        run: node scripts/mobile-a1-primary-tab-focus-acceptance.mjs
      - name: A1 Alerts severity
        run: node scripts/mobile-a1-alert-severity-acceptance.mjs
      - name: A2 Operational Sort
        run: node scripts/mobile-a2-operational-sort-acceptance.mjs
      - name: A2 Workspace
        run: node scripts/mobile-a2-workspace-acceptance.mjs
      - name: A2 Visual Polish
        run: node scripts/mobile-a2-visual-polish-acceptance.mjs
      - name: A3 Operator Context
        run: node scripts/mobile-a3-operator-context-acceptance.mjs
      - name: A3 Period History
        run: node scripts/mobile-a3-period-history-acceptance.mjs
      - name: A3 Immutable Period Ownership
        run: node scripts/mobile-a3-period-ownership-acceptance.mjs
      - name: A3 Navigation Context
        run: node scripts/mobile-a3-navigation-context-acceptance.mjs
      - name: A4 Detail History Reload
        run: node scripts/mobile-a4-detail-history-acceptance.mjs
      - name: A5 Period Sheet Reload
        run: node scripts/mobile-a5-period-sheet-reload-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-mobile-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
