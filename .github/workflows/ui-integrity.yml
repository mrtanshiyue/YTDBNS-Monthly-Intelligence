name: UI Integrity

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'mobile-*'

permissions:
  contents: write

jobs:
  static-ui-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Apply A5 focus patch
        if: github.ref_name == 'mobile-a5-period-sheet-focus-rerender' && github.event.head_commit.message == 'Test: run A5 focus patch'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('public/mobile/mobile-vnext.js')
          text = p.read_text()
          marker = "  runtime.subscribe(next => {\n"
          helper = """  function focusPeriodSheetClose() {
            const close = root.querySelector('.vnext-sheet [data-vnext-close-sheet]');
            if (!close) return false;
            try { close.focus({ preventScroll: true }); }
            catch { close.focus(); }
            return document.activeElement === close;
          }

"""
          if text.count(marker) != 1:
              raise SystemExit(f'runtime.subscribe marker count={text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)

          old_sub = """  runtime.subscribe(next => {
            const periodChanged = state.runtimeState?.from !== next.from || state.runtimeState?.to !== next.to;
            state.runtimeState = next;
"""
          new_sub = """  runtime.subscribe(next => {
            const preservePeriodSheetCloseFocus = state.sheet === 'period' &&
              document.activeElement?.matches?.('.vnext-sheet [data-vnext-close-sheet]');
            const periodChanged = state.runtimeState?.from !== next.from || state.runtimeState?.to !== next.to;
            state.runtimeState = next;
"""
          if old_sub not in text:
              raise SystemExit('runtime.subscribe contract changed')
          text = text.replace(old_sub, new_sub, 1)

          old_render = """    if (state.active && media.matches) {
              render();
              if (state.tab === 'trends') loadComparison();
            }
"""
          new_render = """    if (state.active && media.matches) {
              render();
              if (preservePeriodSheetCloseFocus) requestAnimationFrame(focusPeriodSheetClose);
              if (state.tab === 'trends') loadComparison();
            }
"""
          if old_render not in text:
              raise SystemExit('runtime render contract changed')
          text = text.replace(old_render, new_render, 1)

          old_activate = """    if (state.sheet === 'period') {
              requestAnimationFrame(() => root.querySelector('.vnext-sheet [data-vnext-close-sheet]')?.focus());
            }
"""
          new_activate = """    if (state.sheet === 'period') requestAnimationFrame(focusPeriodSheetClose);
"""
          if old_activate not in text:
              raise SystemExit('activate focus contract changed')
          text = text.replace(old_activate, new_activate, 1)
          p.write_text(text)

          p = Path('scripts/mobile-a5-period-sheet-reload-acceptance.mjs')
          text = p.read_text()
          storage_expect = """  expect(
            !source.includes('localStorage.') && !source.includes('sessionStorage.'),
            'A5 static contract: Reload continuity adds no browser-storage dependency'
          );
"""
          focus_expect = """  expect(
            source.includes('preservePeriodSheetCloseFocus') &&
              source.includes('requestAnimationFrame(focusPeriodSheetClose)'),
            'A5 static contract: runtime-driven rerenders preserve reconstructed period-sheet close focus'
          );
"""
          if storage_expect not in text:
              raise SystemExit('A5 static storage contract changed')
          text = text.replace(storage_expect, focus_expect + storage_expect, 1)

          old_reload = """    expect(evidence.afterReload.closeFocused, `${label}/reload: reconstructed dialog owns initial focus`, JSON.stringify(evidence.afterReload));

            await page.goBack({ waitUntil: 'load' }).catch(() => null);
"""
          new_reload = """    expect(evidence.afterReload.closeFocused, `${label}/reload: reconstructed dialog owns initial focus`, JSON.stringify(evidence.afterReload));

            await page.evaluate(() => window.YT_SHARED_RUNTIME?.refresh?.());
            await waitReady(page);
            await waitSheet(page);
            evidence.afterRuntimeRefresh = await snapshot(page);
            expectSheet(evidence.afterRuntimeRefresh, `${label}/runtime-refresh`, expected);
            expect(evidence.afterRuntimeRefresh.closeFocused, `${label}/runtime-refresh: live-style runtime rerender preserves reconstructed dialog focus`, JSON.stringify(evidence.afterRuntimeRefresh));

            await page.goBack({ waitUntil: 'load' }).catch(() => null);
"""
          if old_reload not in text:
              raise SystemExit('A5 reload acceptance contract changed')
          text = text.replace(old_reload, new_reload, 1)
          p.write_text(text)
          PY
          node --check public/mobile/mobile-vnext.js
          node --check scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/mobile/mobile-vnext.js scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          git commit -m 'Mobile A5: preserve period-sheet focus across runtime rerenders'
          git push origin HEAD:mobile-a5-period-sheet-focus-rerender
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check public/current-ui.js
          node --check public/shared/runtime.js
          node --check public/shared/selectors.js
          node --check public/shared/secondary-selectors.js
          node --check public/mobile/mobile-shell.js
          node --check public/mobile/mobile-app-bridge.js
          node --check public/mobile/mobile-vnext-density.js
          node --check public/mobile/mobile-vnext-ia.js
          node --check public/mobile/mobile-compare.js
          node --check public/mobile/mobile-interactions.js
          node --check public/mobile/views/overview.js
          node --check public/mobile/views/ads.js
          node --check public/mobile/views/products.js
          node --check public/mobile/views/inventory.js
          node --check public/mobile/views/finance.js
          node --check public/mobile/views/charges.js
          node --check public/mobile/views/returns.js
          node --check public/mobile/views/history.js
          node --check public/mobile/views/data.js
          node --check scripts/postinstall-gate.mjs
          node --check scripts/ui-integrity-static-check.mjs
          node --check scripts/v5-native-mobile-static-check.mjs
          node --check scripts/mobile-vnext-ia-static-check.mjs
          node --check scripts/mobile-vnext-ia-acceptance.mjs
          node --check scripts/mobile-first-screen-static-check.mjs
          node --check scripts/mobile-first-screen-acceptance.mjs
          node --check scripts/mobile-a1-narrow-acceptance.mjs
          node --check scripts/mobile-a1-active-rail-acceptance.mjs
          node --check scripts/mobile-a1-three-fact-acceptance.mjs
          node --check scripts/mobile-a1-fact-label-acceptance.mjs
          node --check scripts/mobile-a1-active-filter-acceptance.mjs
          node --check scripts/mobile-a1-primary-tab-focus-acceptance.mjs
          node --check scripts/mobile-a1-alert-severity-acceptance.mjs
          node --check scripts/mobile-a1-period-sheet-focus-acceptance.mjs
          node --check scripts/mobile-a1-period-selection-focus-acceptance.mjs
          node --check scripts/mobile-a2-operational-sort-acceptance.mjs
          node --check scripts/mobile-a2-workspace-acceptance.mjs
          node --check scripts/mobile-a2-visual-polish-acceptance.mjs
          node --check scripts/mobile-a3-operator-context-acceptance.mjs
          node --check scripts/mobile-a3-period-history-acceptance.mjs
          node --check scripts/mobile-a3-period-ownership-acceptance.mjs
          node --check scripts/mobile-a3-navigation-context-acceptance.mjs
          node --check scripts/mobile-a4-detail-history-acceptance.mjs
          node --check scripts/mobile-a5-period-sheet-reload-acceptance.mjs
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Desktop + Native Mobile static release gate
        run: npm run check:release:static
      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match "Noto Sans CJK SC" | grep -qi "NotoSansCJK"
      - name: Install Playwright Chromium
        run: npx playwright-core install chromium
      - name: Mobile A1 period-sheet focus Chromium acceptance
        run: node scripts/mobile-a1-period-sheet-focus-acceptance.mjs
      - name: Mobile A1 period-selection focus Chromium acceptance
        run: node scripts/mobile-a1-period-selection-focus-acceptance.mjs
      - name: Current vNext Mobile IA Chromium acceptance
        run: npm run check:v5:mobile:ia:browser
      - name: Mobile first-screen Chromium acceptance
        run: npm run check:v5:mobile:first-screen:browser
      - name: Mobile A1 narrow-screen Chromium acceptance
        run: node scripts/mobile-a1-narrow-acceptance.mjs
      - name: Mobile A1 active-rail Chromium acceptance
        run: node scripts/mobile-a1-active-rail-acceptance.mjs
      - name: Mobile A1 three-fact Chromium acceptance
        run: node scripts/mobile-a1-three-fact-acceptance.mjs
      - name: Mobile A1 fact-label Chromium acceptance
        run: node scripts/mobile-a1-fact-label-acceptance.mjs
      - name: Mobile A1 active-filter Chromium acceptance
        run: node scripts/mobile-a1-active-filter-acceptance.mjs
      - name: Mobile A1 primary-tab focus Chromium acceptance
        run: node scripts/mobile-a1-primary-tab-focus-acceptance.mjs
      - name: Mobile A1 Alerts severity Chromium acceptance
        run: node scripts/mobile-a1-alert-severity-acceptance.mjs
      - name: Mobile A2 operational-sort Chromium acceptance
        run: node scripts/mobile-a2-operational-sort-acceptance.mjs
      - name: Mobile A2 Workspace Chromium acceptance
        run: node scripts/mobile-a2-workspace-acceptance.mjs
      - name: Mobile A2 visual polish Chromium acceptance
        run: node scripts/mobile-a2-visual-polish-acceptance.mjs
      - name: Mobile A3 operator-context Chromium acceptance
        run: node scripts/mobile-a3-operator-context-acceptance.mjs
      - name: Mobile A3 period-history Chromium acceptance
        run: node scripts/mobile-a3-period-history-acceptance.mjs
      - name: Mobile A3 immutable period-ownership Chromium acceptance
        run: node scripts/mobile-a3-period-ownership-acceptance.mjs
      - name: Mobile A3 navigation-context Chromium acceptance
        run: node scripts/mobile-a3-navigation-context-acceptance.mjs
      - name: Mobile A4 detail-history Chromium acceptance
        run: node scripts/mobile-a4-detail-history-acceptance.mjs
      - name: Mobile A5 period-sheet Reload Chromium acceptance
        run: node scripts/mobile-a5-period-sheet-reload-acceptance.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-mobile-acceptance-${{ github.sha }}
          path: |
            artifacts/mobile-vnext-ia
            artifacts/mobile-first-screen
            artifacts/mobile-a1-narrow
            artifacts/mobile-a1-active-rail
            artifacts/mobile-a1-three-fact
            artifacts/mobile-a1-fact-label
            artifacts/mobile-a1-active-filter
            artifacts/mobile-a1-primary-tab-focus
            artifacts/mobile-a1-alert-severity
            artifacts/mobile-a1-period-sheet-focus
            artifacts/mobile-a1-period-selection-focus
            artifacts/mobile-a2-operational-sort
            artifacts/mobile-a2-workspace
            artifacts/mobile-a2-visual-polish
            artifacts/mobile-a3-operator-context
            artifacts/mobile-a3-period-history
            artifacts/mobile-a3-period-ownership
            artifacts/mobile-a3-navigation-context
            artifacts/mobile-a4-detail-history
            artifacts/mobile-a5-period-sheet-reload
          if-no-files-found: ignore
          retention-days: 7
