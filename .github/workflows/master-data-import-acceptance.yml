name: Master Data Import Acceptance

on:
  push:
    branches:
      - fix/master-data-import-period

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Static and deployment gates
        run: |
          node --check public/master-data-import-period.js
          npm run check:release:static
          npx wrangler deploy --dry-run
      - name: Prepare local D1
        run: npm run db:migrate:local
      - name: Build realistic cost-master XLSX fixture
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          from xml.sax.saxutils import escape

          rows = [
            ['SKU','店铺','站点','原产品字段','采购成本','头程费用','FBM运费成本','货币','更新日期'],
            ['SKU-A','YTDBNS','us','SKU-A B000000001',4.72,0,0,'USD','2026年7月14日 19:39 PDT'],
            ['SKU-B','YTDBNS','us','SKU-B B000000002',3.45,0,0,'USD','2026年1月13日 21:45 PST'],
          ]
          def col(n):
            s=''
            while n:
              n, r = divmod(n-1, 26)
              s = chr(65+r)+s
            return s
          xml_rows=[]
          for ri,row in enumerate(rows,1):
            cells=[]
            for ci,value in enumerate(row,1):
              ref=f'{col(ci)}{ri}'
              if isinstance(value,(int,float)):
                cells.append(f'<c r="{ref}"><v>{value}</v></c>')
              else:
                cells.append(f'<c r="{ref}" t="inlineStr"><is><t>{escape(str(value))}</t></is></c>')
            xml_rows.append(f'<row r="{ri}">{"".join(cells)}</row>')
          sheet='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>%s</sheetData></worksheet>''' % ''.join(xml_rows)
          workbook='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="采购成本库" sheetId="1" r:id="rId1"/></sheets></workbook>'''
          rels='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'''
          content='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'''
          rootrels='''<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'''
          out=Path('/tmp/采购成本库(3).xlsx')
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
            z.writestr('[Content_Types].xml',content)
            z.writestr('_rels/.rels',rootrels)
            z.writestr('xl/workbook.xml',workbook)
            z.writestr('xl/_rels/workbook.xml.rels',rels)
            z.writestr('xl/worksheets/sheet1.xml',sheet)
          print(out)
          PY
      - name: Install Chromium
        run: npx playwright-core install chromium
      - name: Start local Worker
        run: |
          nohup npx wrangler dev --local --port 8787 > /tmp/master-data-wrangler.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/master-data-wrangler.log
          exit 1
      - name: Chromium master-data import acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 960 } });
          await page.goto('http://127.0.0.1:8787', { waitUntil: 'networkidle' });
          await page.waitForFunction(() => Boolean(window.YT_MASTER_DATA_IMPORT_PERIOD) && Boolean(window.YT_MULTI_FILE_IMPORT));
          await page.locator('#topImportBtn').click();
          await page.locator('#importFiles').setInputFiles('/tmp/采购成本库(3).xlsx');
          await page.locator('#importPeriodValue').filter({ hasText: '主数据导入' }).waitFor({ state: 'visible', timeout: 7000 });
          await page.locator('#importPeriodDetail').filter({ hasText: '不要求报告月份' }).waitFor({ state: 'visible' });
          assert.equal(await page.locator('#validateBtn').isEnabled(), true);
          assert.equal(await page.locator('#importMonth').getAttribute('data-period-mode'), 'master');

          await page.locator('#validateBtn').click();
          await page.locator('#validationBox').filter({ hasText: '1 个 · 全部将单独归档' }).waitFor({ state: 'visible', timeout: 7000 });
          const snapshot = await page.evaluate(() => window.YT_MULTI_FILE_IMPORT.getSnapshot());
          assert.equal(snapshot.selectedFileCount, 1);
          assert.equal(snapshot.validatedFileCount, 1);
          assert.deepEqual(snapshot.roles, ['cost']);
          assert.equal(snapshot.normalized.costMaster.length, 2);

          await page.locator('#commitBtn').click();
          await page.waitForTimeout(2200);
          const logsRes = await page.request.get('http://127.0.0.1:8787/api/operation-logs?store=ytdbns&limit=20');
          assert.equal(logsRes.ok(), true);
          const logs = (await logsRes.json()).logs || [];
          const commit = logs.find(log => log.event_type === 'IMPORT_COMMITTED');
          assert.ok(commit, 'IMPORT_COMMITTED missing');
          assert.equal(commit.detail.fileCount, 1);
          assert.equal(commit.detail.sourceCount, 1);
          assert.equal(commit.detail.files[0].filename, '采购成本库(3).xlsx');
          await browser.close();
          console.log('Master-data XLSX import browser/API acceptance: PASS');
          NODE
      - name: Verify master data did not create business month
        run: |
          npx wrangler d1 execute ytdbns-monthly-db --local --command "SELECT COUNT(*) AS cost_count FROM cost_master; SELECT COUNT(*) AS month_count FROM monthly_metrics;" --json > /tmp/master-check.json
          cat /tmp/master-check.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/master-check.json'))
          results=[]
          for block in data:
            results.extend(block.get('results',[]))
          values={k:v for row in results for k,v in row.items()}
          assert values.get('cost_count') == 2, values
          assert values.get('month_count') == 0, values
          print('D1 master-only invariant: PASS')
          PY
