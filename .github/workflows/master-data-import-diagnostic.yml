name: Master Data Import Diagnostic
on:
  push:
    branches: [fix/master-data-import-period]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run db:migrate:local
      - name: Build XLSX
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from xml.sax.saxutils import escape
          rows=[['SKU','店铺','站点','原产品字段','采购成本','头程费用','FBM运费成本','货币','更新日期'],['SKU-A','YTDBNS','us','SKU-A B000000001',4.72,0,0,'USD','2026年7月14日 19:39 PDT']]
          def col(n):
            s=''
            while n:n,r=divmod(n-1,26);s=chr(65+r)+s
            return s
          rr=[]
          for ri,row in enumerate(rows,1):
            cc=[]
            for ci,v in enumerate(row,1):
              ref=f'{col(ci)}{ri}'
              cc.append(f'<c r="{ref}"><v>{v}</v></c>' if isinstance(v,(int,float)) else f'<c r="{ref}" t="inlineStr"><is><t>{escape(str(v))}</t></is></c>')
            rr.append(f'<row r="{ri}">{"".join(cc)}</row>')
          sheet='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+''.join(rr)+'</sheetData></worksheet>'
          wb='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="采购成本库" sheetId="1" r:id="rId1"/></sheets></workbook>'
          rel='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'
          with ZipFile('/tmp/cost.xlsx','w',ZIP_DEFLATED) as z:
            z.writestr('xl/workbook.xml',wb);z.writestr('xl/_rels/workbook.xml.rels',rel);z.writestr('xl/worksheets/sheet1.xml',sheet)
          PY
      - run: npx playwright-core install chromium
      - name: Start Worker
        run: |
          nohup npx wrangler dev --local --port 8787 >/tmp/wrangler.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/api/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/wrangler.log; exit 1
      - name: Capture browser state
        run: |
          mkdir -p artifacts/master-diagnostic
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import {chromium} from 'playwright-core';
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:1440,height:960}});
          const events=[]; page.on('console',m=>events.push({type:'console',text:m.text()})); page.on('pageerror',e=>events.push({type:'pageerror',text:String(e)})); page.on('requestfailed',r=>events.push({type:'requestfailed',url:r.url(),error:r.failure()?.errorText}));
          await page.goto('http://127.0.0.1:8787',{waitUntil:'networkidle'});
          const asset=await page.request.get('http://127.0.0.1:8787/master-data-import-period.js');
          const before=await page.evaluate(()=>({master:Boolean(window.YT_MASTER_DATA_IMPORT_PERIOD),multi:Boolean(window.YT_MULTI_FILE_IMPORT),script:[...document.scripts].map(s=>s.src).filter(Boolean),status:document.querySelector('#importPeriodStatus')?.outerHTML}));
          await page.locator('#topImportBtn').click(); await page.locator('#importFiles').setInputFiles('/tmp/cost.xlsx'); await page.waitForTimeout(2500);
          const after=await page.evaluate(()=>({master:Boolean(window.YT_MASTER_DATA_IMPORT_PERIOD),masterState:window.YT_MASTER_DATA_IMPORT_PERIOD?.getState?.(),month:document.querySelector('#importMonth')?.value,mode:document.querySelector('#importMonth')?.dataset?.periodMode,value:document.querySelector('#importPeriodValue')?.textContent,detail:document.querySelector('#importPeriodDetail')?.textContent,validateDisabled:document.querySelector('#validateBtn')?.disabled,files:document.querySelector('#fileStack')?.textContent}));
          fs.writeFileSync('artifacts/master-diagnostic/state.json',JSON.stringify({assetStatus:asset.status(),assetText:(await asset.text()).slice(0,300),before,after,events},null,2));
          await page.screenshot({path:'artifacts/master-diagnostic/screenshot.png',fullPage:true}); await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: master-data-import-diagnostic-${{ github.sha }}
          path: artifacts/master-diagnostic
          retention-days: 7
