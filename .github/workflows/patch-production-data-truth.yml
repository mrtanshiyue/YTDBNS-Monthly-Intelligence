name: Patch Production Data Truth

on:
  push:
    branches:
      - hotfix/production-no-demo-fallback2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/production-no-demo-fallback2
      - name: Patch active load order and legacy studio guard
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          old = '  <script src="./demo-data.js"></script>\n  <script src="./engine.js"></script>'
          new = '  <script src="./demo-data.js"></script>\n  <script src="./production-data-guard.js"></script>\n  <script src="./engine.js"></script>'
          if old not in text:
              raise SystemExit('index insertion anchor missing')
          index.write_text(text.replace(old, new, 1))

          studio = Path('public/studio.js')
          text = studio.read_text()
          old = '  const C = D.current || {};\n  if (!C || !Object.keys(C).length) return;'
          new = '  const C = D.current || {};\n  if (window.YT_DATA_TRUTH?.demoSuppressed) return;\n  if (!C || !Object.keys(C).length) return;'
          if old not in text:
              raise SystemExit('studio guard anchor missing')
          studio.write_text(text.replace(old, new, 1))
          PY
      - name: Commit product patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/index.html public/studio.js
          git commit -m "Block demo data from production rendering"
          git push origin HEAD:hotfix/production-no-demo-fallback2
