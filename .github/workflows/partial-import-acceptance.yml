name: Partial Report Import Acceptance

on:
  push:
    branches:
      - feature/partial-report-import-v2

permissions:
  contents: read

env:
  WORKERS_CI: '1'
  WORKERS_CI_BRANCH: main
  WORKERS_CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and static gates
        run: |
          npm install --no-audit --no-fund
          node --check public/partial-import-ui.js
          node --check src/partial-import.js
          node --check src/worker-entry.js
          npm run check:release:static
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run
      - name: Prepare local D1
        run: npm run db:migrate:local
      - name: Start local Worker
        run: |
          npx wrangler dev --local --port 8787 > /tmp/partial-worker.log 2>&1 &
          echo $! > /tmp/partial-worker.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/partial-worker.log
          exit 1
      - name: Backend partial merge regression
        run: |
          node <<'NODE'
          const base = 'http://127.0.0.1:8787';
          const store = 'ytdbns';
          const api = async (path, init={}) => {
            const res = await fetch(`${base}${path}${path.includes('?')?'&':'?'}store=${store}`, init);
            const body = await res.json();
            if (!res.ok || body.ok === false) throw new Error(`${path}: ${res.status} ${JSON.stringify(body)}`);
            return body;
          };
          async function start(month) {
            return api('/api/imports/start', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({storeId:store,month,createdBy:'acceptance'}) });
          }
          async function upload(batchId, month, role, name) {
            const fd = new FormData();
            fd.set('batchId', batchId); fd.set('storeId', store); fd.set('month', month); fd.set('reportType', role); fd.set('rowCount','2');
            fd.set('file', new File([`acceptance ${role}`], name, {type:'text/csv'}));
            return api('/api/imports/file', { method:'POST', body:fd });
          }
          async function commit(batchId, payload) {
            return api('/api/imports/commit', { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({batchId,payload}) });
          }
          const check = [{item:'本次数据源',status:'PASS',value:'1 类',detail:'partial'}];

          const adsBatch = await start('2026-07');
          await upload(adsBatch.batchId,'2026-07','ads','广告每日视图.csv');
          const adsCommit = await commit(adsBatch.batchId, {
            storeId:store,month:'2026-07',checks:check,monthly:{},
            daily:[{date:'2026-07-10',adSpend:10,adSales:100,adOrders:2,impressions:1000,clicks:20}],
            campaignEvents:[{date:'2026-07-10',portfolio:'P',campaign:'C1',spend:10,sales:100,orders:2,impressions:1000,clicks:20}],
            campaigns:[]
          });
          if (!adsCommit.partial || adsCommit.sourceCount !== 1) throw new Error(`ads partial contract: ${JSON.stringify(adsCommit)}`);
          let month = await api('/api/month?month=2026-07');
          if (Number(month.metrics.ad_spend) !== 10 || month.campaigns.length !== 1) throw new Error(`ads write failed: ${JSON.stringify(month)}`);

          const returnBatch = await start('2026-07');
          await upload(returnBatch.batchId,'2026-07','returns','退货报告.csv');
          const returnCommit = await commit(returnBatch.batchId, {
            storeId:store,month:'2026-07',checks:check,monthly:{},
            daily:[
              {date:'2026-06-05',returns:1},
              {date:'2026-07-12',returns:2},
              {date:'2026-08-03',returns:3}
            ],
            returnEvents:[
              {date:'2026-06-05',reason:'JUNE',disposition:'SELLABLE',count:1},
              {date:'2026-07-12',reason:'JULY',disposition:'DAMAGED',count:2},
              {date:'2026-08-03',reason:'AUGUST',disposition:'SELLABLE',count:3}
            ],
            returnReasons:[]
          });
          if (JSON.stringify(returnCommit.affectedMonths) !== JSON.stringify(['2026-06','2026-07','2026-08'])) throw new Error(`cross-month affected months: ${JSON.stringify(returnCommit)}`);

          month = await api('/api/month?month=2026-07');
          if (Number(month.metrics.ad_spend) !== 10) throw new Error(`returns import erased ads: ${JSON.stringify(month.metrics)}`);
          if (Number(month.metrics.returns) !== 2) throw new Error(`July returns incorrect: ${JSON.stringify(month.metrics)}`);
          if (month.campaigns.length !== 1 || month.returns.find(row => row.reason === 'JULY')?.count !== 2) throw new Error(`domain detail merge failed: ${JSON.stringify(month)}`);
          const june = await api('/api/month?month=2026-06');
          const august = await api('/api/month?month=2026-08');
          if (Number(june.metrics.returns) !== 1 || Number(august.metrics.returns) !== 3) throw new Error('cross-month return rows were not distributed by actual dates');
          console.log('BACKEND PARTIAL MERGE: PASS');
          NODE
      - name: Browser single-report UX regression
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : '/usr/bin/google-chrome-stable';
          const file = (name,text) => ({name,mimeType:'text/csv',buffer:Buffer.from(text)});
          (async()=>{
            const browser = await chromium.launch({headless:true,executablePath});
            const page = await browser.newPage({viewport:{width:862,height:1800}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8787',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#ytStoreSwitcher',{timeout:15000});
            await page.waitForTimeout(1000);
            await page.click('#topImportBtn');
            await page.waitForSelector('#importDrawer.show');

            await page.setInputFiles('#importFiles', [file('退货报告.csv','return-date,sku,reason,quantity,detailed-disposition\n2026-06-05,A,JUNE,1,SELLABLE\n2026-07-12,B,JULY,2,DAMAGED\n2026-08-03,C,AUGUST,3,SELLABLE\n')]);
            await page.waitForFunction(()=>document.querySelector('#importMonth')?.value,{timeout:15000});
            await page.click('#validateBtn');
            await page.waitForFunction(()=>document.querySelector('#validationBox .validation-line') && document.querySelector('#sourceCount')?.textContent.includes('1 类'),{timeout:15000});
            const returnsState = await page.evaluate(()=>({
              count:document.querySelector('#sourceCount')?.textContent.trim(),
              note:document.querySelector('#ytPartialImportNote')?.textContent.trim(),
              disabled:document.querySelector('#commitBtn')?.disabled,
              validation:document.querySelector('#validationBox')?.textContent.trim()
            }));
            if (returnsState.count !== '1 类' || returnsState.disabled || !returnsState.note.includes('单个报表也可') || !returnsState.validation.includes('可独立写入')) throw new Error(`single returns UX failed: ${JSON.stringify(returnsState)}`);

            await page.setInputFiles('#importFiles', [file('采购成本.csv','SKU,采购成本,更新日期\nSKU1,10,2026-07-02\nSKU2,12,2026-07-15\n')]);
            await page.waitForFunction(()=>document.querySelector('#importMonth')?.value==='2026-07',{timeout:15000});
            await page.click('#validateBtn');
            await page.waitForFunction(()=>document.querySelector('#sourceCount')?.textContent.includes('1 类') && !document.querySelector('#commitBtn')?.disabled,{timeout:15000});
            const costState = await page.evaluate(()=>({month:document.querySelector('#importMonth')?.value,period:document.querySelector('#importPeriodValue')?.textContent.trim(),disabled:document.querySelector('#commitBtn')?.disabled}));
            if (costState.month !== '2026-07' || costState.disabled) throw new Error(`single cost UX failed: ${JSON.stringify(costState)}`);
            if (errors.length) throw new Error(`page errors: ${errors.join(' | ')}`);
            await page.screenshot({path:'/tmp/partial-import.png',fullPage:true});
            await browser.close();
            console.log('BROWSER SINGLE REPORT UX: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-import-${{ github.sha }}
          path: /tmp/partial-import.png
          retention-days: 7
