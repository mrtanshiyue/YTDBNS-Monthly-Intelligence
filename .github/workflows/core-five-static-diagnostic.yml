name: Core Five Static Diagnostic
on:
  push:
    branches: [refactor/report-source-consolidation]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax browser model
        run: node --check public/core-five-report-model.js
      - name: Syntax backend model
        run: node --check src/core-five-import.js
      - name: Syntax worker entry
        run: node --check src/worker-entry.js
      - name: Five-source regression
        run: npm run check:core-five-report-model
      - name: V5 mobile static
        run: npm run check:v5:mobile:static
      - name: UI integrity static
        run: npm run check:ui:static
      - name: Operation log static
        run: npm run check:operation-log
      - name: Import report compatibility
        run: npm run check:import-report-compat
      - name: Multi-file import static
        run: npm run check:multi-file-import
      - name: Master-data period static
        run: npm run check:master-data-import-period
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
