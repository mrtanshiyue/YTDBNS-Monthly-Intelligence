name: Mobile A3 Hotfix Production Smoke

on:
  push:
    branches:
      - acceptance/a3-hotfix-production-smoke

permissions:
  contents: read

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      A3_PRODUCTION_URL: https://ytdbns-monthly-intelligence.tanshiyuesir.workers.dev/
    steps:
      - name: Checkout exact acceptance head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Production serves exact-main hotfix bridge
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "${A3_PRODUCTION_URL}mobile/mobile-app-bridge.js" \
            -o /tmp/production-mobile-app-bridge.js
          cmp public/mobile/mobile-app-bridge.js /tmp/production-mobile-app-bridge.js
          grep -q "storedRange && !pendingPeriodSelection" /tmp/production-mobile-app-bridge.js
          grep -q "\[data-vnext-month\], \[data-density-month\]" /tmp/production-mobile-app-bridge.js
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "${A3_PRODUCTION_URL}api/health" \
            -o /tmp/production-health.json
          cat /tmp/production-health.json

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium

      - name: Run A3 Phase 2 Back Forward Reload against real Production
        run: |
          cp scripts/mobile-a3-period-history-acceptance.mjs scripts/.tmp-mobile-a3-hotfix-production-acceptance.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/.tmp-mobile-a3-hotfix-production-acceptance.mjs')
          text = p.read_text()
          old_entry = "const entry = pathToFileURL(path.join(root, 'public', 'index.html')).href;"
          new_entry = "const entry = process.env.A3_PRODUCTION_URL;"
          if old_entry not in text:
              raise SystemExit('acceptance entry contract changed')
          text = text.replace(old_entry, new_entry, 1)
          old_forward = """    await page.goForward({ waitUntil: 'load' }).catch(() => null);\n    await waitCombined(page, inventoryExpected);\n    evidence.afterForward = await snapshot(page, 'inventory');"""
          new_forward = """    await page.goForward({ waitUntil: 'load' }).catch(() => null);\n    try {\n      await waitCombined(page, inventoryExpected);\n    } catch (error) {\n      const diagnostic = await snapshot(page, 'inventory');\n      const browserDiagnostic = await page.evaluate(() => {\n        const runtime = window.YT_SHARED_RUNTIME?.getState?.();\n        return {\n          historyLength: history.length,\n          historyState: history.state,\n          location: location.href,\n          ready: document.documentElement.dataset.mobileVnextReady || null,\n          appTab: document.querySelector('.vnext-app')?.dataset?.tab || null,\n          density: window.YT_MOBILE_VNEXT_DENSITY?.getState?.() || null,\n          ia: window.YT_MOBILE_VNEXT_IA?.getState?.() || null,\n          runtime: runtime ? { from: runtime.from, to: runtime.to, loading: runtime.loading, mode: runtime.mode, error: runtime.error } : null,\n          period: window.YT_MOBILE_APP?.getPeriodContext?.() || null\n        };\n      });\n      console.error(`FORWARD_DIAGNOSTIC_V2 ${label} ${JSON.stringify({ expected: inventoryExpected, diagnostic, browserDiagnostic })}`);\n      throw error;\n    }\n    evidence.afterForward = await snapshot(page, 'inventory');"""
          if old_forward not in text:
              raise SystemExit('forward acceptance contract changed')
          p.write_text(text.replace(old_forward, new_forward, 1))
          PY
          node scripts/.tmp-mobile-a3-hotfix-production-acceptance.mjs

      - name: Upload Production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-a3-hotfix-production-${{ github.sha }}
          path: artifacts/mobile-a3-period-history
          if-no-files-found: ignore
          retention-days: 7
