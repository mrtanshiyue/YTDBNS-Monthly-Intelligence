name: Cross-month Import Acceptance

on:
  push:
    branches:
      - fix/import-cross-month-inference

permissions:
  contents: read

env:
  WORKERS_CI: '1'
  WORKERS_CI_BRANCH: main
  WORKERS_CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and release gates
        run: |
          node --check public/import-auto-period.js
          npm install --no-audit --no-fund
          npm run check:release:static
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run
      - name: Prepare Chrome
        run: |
          npm install --no-save --ignore-scripts playwright-core
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable
          echo '127.0.0.1 crossmonth.local' | sudo tee -a /etc/hosts
      - name: Browser regression
        run: |
          python3 -m http.server 8788 --directory public >/tmp/cross-month-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : '/usr/bin/google-chrome-stable';
          const base = 'http://crossmonth.local:8788';
          const csvFile = (name, text) => ({ name, mimeType: 'text/csv', buffer: Buffer.from(text) });
          const datedRows = (month, days, prefix='') => days.map((day, i) => `${prefix}${month}-${String(day).padStart(2,'0')},SKU${i+1},OTHER`).join('\n');
          const common = [
            csvFile('采购成本.csv', 'SKU,采购成本\nSKU1,10\n'),
            csvFile('父体业务报告.csv', 'x\n1\n'),
            csvFile('商品信息.csv', 'x\n1\n'),
            csvFile('FBA库存.csv', 'x\n1\n'),
            csvFile('月度仓储费.csv', 'x\n1\n'),
            csvFile('子体业务报告.csv', 'x\n1\n')
          ];
          const transaction = month => csvFile('联合报告.csv', `settlement id,date/time,product sales\n1,${month}-05,100\n2,${month}-15,200\n3,${month}-25,300\n`);
          const ads = month => csvFile('广告每日视图.csv', `广告活动名称,7天总销售额,日期\nA,100,${month}-03\nB,120,${month}-13\nC,130,${month}-23\n`);
          const returnsCrossing = () => csvFile('退货报告.csv', [
            'return-date,sku,reason',
            ...Array.from({length:10},(_,i)=>`2026-06-${String(i+1).padStart(2,'0')},JUN${i},OTHER`),
            '2026-07-07,JUL1,OTHER',
            '2026-07-19,JUL2,OTHER',
            ...Array.from({length:10},(_,i)=>`2026-08-${String(i+1).padStart(2,'0')},AUG${i},OTHER`)
          ].join('\n'));
          const returnsNoJuly = () => csvFile('退货报告.csv', [
            'return-date,sku,reason',
            '2026-06-05,JUN1,OTHER',
            '2026-06-20,JUN2,OTHER',
            '2026-08-05,AUG1,OTHER',
            '2026-08-20,AUG2,OTHER'
          ].join('\n'));
          const bundle = (txMonth, adsMonth, returnsFile) => [transaction(txMonth), ads(adsMonth), returnsFile, ...common];

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath });
            const page = await browser.newPage({ viewport: { width: 862, height: 1800 } });
            const pageErrors = [];
            const writes = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('request', r => { if (!['GET','HEAD','OPTIONS'].includes(r.method())) writes.push({method:r.method(),url:r.url()}); });
            await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#ytStoreSwitcher', { timeout: 15000 });
            await page.waitForTimeout(900);
            await page.click('#topImportBtn');
            await page.waitForSelector('#importDrawer.show');

            await page.setInputFiles('#importFiles', bundle('2026-07','2026-07',returnsCrossing()));
            await page.waitForFunction(() => document.querySelector('#importPeriodStatus')?.dataset.state === 'warn' && document.querySelector('#importMonth')?.value === '2026-07', null, { timeout: 15000 });
            const cross = await page.evaluate(() => ({
              month: document.querySelector('#importMonth')?.value,
              state: document.querySelector('#importPeriodStatus')?.dataset.state,
              value: document.querySelector('#importPeriodValue')?.textContent.trim(),
              detail: document.querySelector('#importPeriodDetail')?.textContent.trim(),
              disabled: document.querySelector('#validateBtn')?.disabled
            }));
            if (cross.month !== '2026-07' || cross.state !== 'warn' || cross.disabled || !cross.detail.includes('跨月本身不会阻止导入') || !cross.detail.includes('退货报告')) {
              throw new Error(`cross-month return should be accepted: ${JSON.stringify(cross)}`);
            }
            await page.screenshot({ path: '/tmp/cross-month-accepted.png', fullPage: true });

            await page.setInputFiles('#importFiles', bundle('2026-07','2026-08',returnsCrossing()));
            await page.waitForFunction(() => document.querySelector('#importPeriodStatus')?.dataset.state === 'error', null, { timeout: 15000 });
            const anchorsConflict = await page.evaluate(() => ({
              month: document.querySelector('#importMonth')?.value,
              detail: document.querySelector('#importPeriodDetail')?.textContent.trim(),
              disabled: document.querySelector('#validateBtn')?.disabled
            }));
            if (anchorsConflict.month !== '' || !anchorsConflict.disabled || !anchorsConflict.detail.includes('主报表日期范围没有共同月份')) {
              throw new Error(`disjoint primary anchors should be blocked: ${JSON.stringify(anchorsConflict)}`);
            }

            await page.setInputFiles('#importFiles', bundle('2026-07','2026-07',returnsNoJuly()));
            await page.waitForFunction(() => document.querySelector('#importPeriodStatus')?.dataset.state === 'error', null, { timeout: 15000 });
            const returnsConflict = await page.evaluate(() => ({
              month: document.querySelector('#importMonth')?.value,
              detail: document.querySelector('#importPeriodDetail')?.textContent.trim(),
              disabled: document.querySelector('#validateBtn')?.disabled
            }));
            if (returnsConflict.month !== '' || !returnsConflict.disabled || !returnsConflict.detail.includes('目标月份 2026-07 未出现在')) {
              throw new Error(`returns without target month should be blocked: ${JSON.stringify(returnsConflict)}`);
            }

            if (writes.length) throw new Error(`acceptance made write requests: ${JSON.stringify(writes)}`);
            if (pageErrors.length) throw new Error(`page errors: ${pageErrors.join(' | ')}`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-month-import-${{ github.sha }}
          path: /tmp/cross-month-accepted.png
          retention-days: 7
