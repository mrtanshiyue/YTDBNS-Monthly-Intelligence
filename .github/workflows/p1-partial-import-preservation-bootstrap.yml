name: P1 Partial Import Preservation Bootstrap

on:
  push:
    branches:
      - 'fix/p1-partial-import-preserve-ads'

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'Bootstrap: fix partial import patch runner'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply preservation patch
        run: python scripts/apply-partial-import-preservation-patch.py
      - name: Verify patch
        run: |
          node --check src/worker.js
          node scripts/p1-partial-import-preservation-check.mjs
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/worker.js scripts/p1-partial-import-preservation-check.mjs scripts/apply-partial-import-preservation-patch.py
          git commit -m 'Fix: preserve modules across partial imports'
          git push origin HEAD:fix/p1-partial-import-preserve-ads
