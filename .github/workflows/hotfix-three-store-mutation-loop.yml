name: Hotfix Three Store Mutation Loop

on:
  push:
    branches:
      - hotfix-three-store-mutation-loop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and release gates
        run: |
          npm install --no-audit --no-fund
          node --check public/engine.js
          npm run check:release:static
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Local browser bootstrap acceptance
        run: |
          mkdir -p artifacts/hotfix
          python3 -m http.server 8788 --directory public > /tmp/hotfix-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/ >/dev/null && break
            sleep 1
          done
          cat > .tmp-hotfix-browser.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));
          await page.goto('http://127.0.0.1:8788/', { waitUntil: 'domcontentloaded', timeout: 15000 });
          await page.waitForSelector('#ytStoreSwitcher select', { state: 'visible', timeout: 10000 });
          const options = await page.locator('#ytStoreSwitcher select option').evaluateAll(nodes => nodes.map(node => [node.value, node.textContent.trim()]));
          const expected = [['ytdbns','YTDBNS'],['yy','YY'],['jj','JJ']];
          if (JSON.stringify(options) !== JSON.stringify(expected)) throw new Error(`store options mismatch: ${JSON.stringify(options)}`);
          await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 750)));
          const noteText = await page.locator('#ytStoreImportNote').innerText();
          if (!noteText.includes('YTDBNS') || !noteText.includes('只属于该店铺')) throw new Error(`store import note mismatch: ${noteText}`);
          await page.evaluate(() => {
            const marker = document.createElement('div');
            marker.id = 'observer-hotfix-probe';
            document.body.appendChild(marker);
          });
          await page.evaluate(() => new Promise(resolve => setTimeout(resolve, 750)));
          if (pageErrors.length) throw new Error(`page errors: ${JSON.stringify(pageErrors)}`);
          await page.screenshot({ path: 'artifacts/hotfix/chromium-desktop.png', fullPage: true });
          console.log('HOTFIX LOCAL BROWSER ACCEPTANCE: PASS');
          await browser.close();
          EOF
          node .tmp-hotfix-browser.mjs
      - name: Wrangler production dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-three-store-mutation-loop-${{ github.sha }}
          path: artifacts/hotfix
          if-no-files-found: warn
          retention-days: 7
