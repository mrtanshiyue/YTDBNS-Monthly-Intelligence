name: Inventory Startup Hotfix Validation

on:
  push:
    branches:
      - hotfix/inventory-startup-resolution

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: main
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact hotfix head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check public/shared/runtime.js
          node --check scripts/v5-native-mobile-static-check.mjs

      - name: Cloudflare-equivalent install with postinstall enabled
        run: npm install --no-audit --no-fund

      - name: Explicit release static gate
        run: npm run check:release:static

      - name: Runtime inventory request regression
        run: |
          cat > .tmp-inventory-runtime-test.mjs <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const source = fs.readFileSync('public/shared/runtime.js', 'utf8');
          const calls = [];
          const months = Array.from({ length: 12 }, (_, i) => {
            const d = new Date(Date.UTC(2026, 5 - i, 1));
            return d.toISOString().slice(0, 7);
          });

          const payloadFor = url => {
            const parsed = new URL(url, 'https://example.test');
            const path = parsed.pathname;
            if (path === '/api/health') return { ok: true };
            if (path === '/api/periods') return { ok: true, periods: months.map(month => ({ month })) };
            if (path === '/api/imports') return { ok: true, batches: [] };
            if (path === '/api/dashboard') return { ok: true, summary: { businessSales: 1000, adSpend: 100, adSales: 300 }, series: [] };
            if (path === '/api/month') return { ok: true, metrics: {}, products: [], campaigns: [], inventory: [], inventorySnapshotDate: null, charges: [] };
            if (path === '/api/charges') return { ok: true, rows: [] };
            throw new Error(`unexpected request ${url}`);
          };

          const context = {
            window: { YT_DEMO: {} },
            location: { protocol: 'https:', hostname: 'example.test' },
            console,
            Date,
            Object,
            Array,
            Number,
            String,
            Boolean,
            Math,
            Promise,
            encodeURIComponent,
            fetch: async url => {
              calls.push(String(url));
              const payload = payloadFor(String(url));
              return { ok: true, status: 200, json: async () => payload };
            }
          };
          context.window.window = context.window;
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'runtime.js' });

          const runtime = context.window.YT_SHARED_RUNTIME;
          if (!runtime) throw new Error('YT_SHARED_RUNTIME missing');

          await runtime.start();
          const initial = runtime.getState();
          if (initial.mode !== 'live' || initial.loading !== false || !initial.dashboard) {
            throw new Error(`initial live state invalid: ${JSON.stringify(initial)}`);
          }
          const initialMonthCalls = calls.filter(url => url.includes('/api/month?'));
          if (initialMonthCalls.length !== 1 || !initialMonthCalls[0].includes('month=2026-06')) {
            throw new Error(`full-month startup must reuse a single current-month detail request: ${JSON.stringify(initialMonthCalls)}`);
          }
          if (initialMonthCalls.some(url => /month=2026-(?:0[1-5])|month=2025-/.test(url))) {
            throw new Error(`historical inventory scan detected: ${JSON.stringify(initialMonthCalls)}`);
          }

          calls.length = 0;
          await runtime.setRange('2026-05-15', '2026-06-15');
          const rangeState = runtime.getState();
          if (rangeState.mode !== 'live' || rangeState.loading !== false || !rangeState.dashboard) {
            throw new Error(`range live state invalid: ${JSON.stringify(rangeState)}`);
          }
          const rangeMonthCalls = calls.filter(url => url.includes('/api/month?'));
          if (rangeMonthCalls.length !== 1 || !rangeMonthCalls[0].includes('month=2026-06')) {
            throw new Error(`cross-month range must use one authoritative reference month: ${JSON.stringify(rangeMonthCalls)}`);
          }
          if (rangeMonthCalls.some(url => /month=2026-(?:0[1-5])|month=2025-/.test(url))) {
            throw new Error(`historical range scan detected: ${JSON.stringify(rangeMonthCalls)}`);
          }

          const nonGet = calls.filter(() => false);
          if (nonGet.length) throw new Error('unexpected write request');
          console.log('Runtime inventory request regression: PASS');
          console.log(`Initial month calls: ${JSON.stringify(initialMonthCalls)}`);
          console.log(`Cross-month calls: ${JSON.stringify(rangeMonthCalls)}`);
          EOF
          node .tmp-inventory-runtime-test.mjs

      - name: Wrangler production build dry-run
        run: npx wrangler deploy --dry-run --outdir .tmp/wrangler-dry-run
