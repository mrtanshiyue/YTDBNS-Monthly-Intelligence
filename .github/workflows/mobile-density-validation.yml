name: Dense Mobile Business Acceptance

on:
  push:
    branches:
      - fix/mobile-density-full-tabs

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKERS_CI: '1'
      WORKERS_CI_BRANCH: main
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check public/mobile/mobile-shell.js
          node --check public/mobile/mobile-vnext.js
          node --check public/mobile/mobile-vnext-density.js
          node --check public/shared/runtime.js

      - name: Cloudflare-equivalent install and release gates
        run: |
          npm install --no-audit --no-fund
          npm run check:release:static
          npx wrangler deploy --dry-run

      - name: Install browsers
        run: npx playwright-core install --with-deps chromium webkit

      - name: Serve exact head
        run: |
          python3 -m http.server 8788 --directory public > /tmp/dense-mobile-http.log 2>&1 &
          echo $! > /tmp/dense-mobile-http.pid

      - name: Dense mobile browser acceptance
        run: |
          mkdir -p artifacts/mobile-density
          cat > .tmp-density-acceptance.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium, webkit } from 'playwright-core';

          const base='http://127.0.0.1:8788';
          const failures=[];
          const report=[];
          const expectedRail=['总览','异常','广告','商品','库存','利润','扣费','退货','历史','数据'];
          const businessModules=['ads','products','inventory','finance','charges','returns','history','data'];
          const expect=(condition,message,detail='')=>{
            if(condition) console.log(`PASS  ${message}`);
            else { const text=`${message}${detail?` — ${detail}`:''}`; failures.push(text); console.error(`FAIL  ${text}`); }
          };
          const visibleButtonsTooSmall=page=>page.evaluate(()=>[...document.querySelectorAll('#mobileAppRoot button')].filter(button=>{
            const rect=button.getBoundingClientRect(); const style=getComputedStyle(button);
            return rect.width>0&&rect.height>0&&style.display!=='none'&&style.visibility!=='hidden'&&rect.height<43.5;
          }).map(button=>({text:button.textContent.trim().slice(0,28),height:button.getBoundingClientRect().height})).slice(0,20));
          const overflow=page=>page.evaluate(()=>({width:innerWidth,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,root:document.getElementById('mobileAppRoot').scrollWidth}));

          async function run(engine,browserType,viewport){
            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({viewport,deviceScaleFactor:3,hasTouch:true,isMobile:true});
            const page=await context.newPage();
            const consoleErrors=[]; const pageErrors=[]; const requestFailures=[]; const apiRequests=[]; const badResponses=[];
            page.on('console',message=>{if(message.type()==='error') consoleErrors.push(message.text())});
            page.on('pageerror',error=>pageErrors.push(error.message));
            page.on('requestfailed',request=>requestFailures.push({url:request.url(),error:request.failure()?.errorText||''}));
            page.on('request',request=>{if(request.url().includes('/api/')) apiRequests.push({method:request.method(),url:request.url()})});
            page.on('response',response=>{if(response.status()>=400) badResponses.push({status:response.status(),url:response.url()})});
            const label=`${engine} ${viewport.width}x${viewport.height}`;
            try{
              await page.goto(base,{waitUntil:'load',timeout:30000});
              await page.waitForFunction(()=>document.documentElement.dataset.mobileVnextReady==='true',null,{timeout:10000});
              await page.waitForSelector('#mobileAppRoot:not([hidden]) .vnext-app',{state:'visible',timeout:10000});
              await page.waitForFunction(()=>window.YT_SHARED_RUNTIME?.getState?.()?.loading===false,null,{timeout:15000});
              await page.waitForSelector('.vnext-module-rail',{state:'visible',timeout:5000});

              const runtime=await page.evaluate(()=>window.YT_SHARED_RUNTIME.getState());
              expect(runtime.mode==='demo',`${label}: demo runtime ready`,runtime.mode);
              const rail=await page.locator('.vnext-module-rail [data-vnext-module]').allTextContents();
              const railLabels=rail.map(text=>text.replace(/\d+/g,'').trim());
              expect(JSON.stringify(railLabels)===JSON.stringify(expectedRail),`${label}: complete 10-label business rail`,JSON.stringify(railLabels));

              await page.click('[data-vnext-module="today"]');
              await page.waitForSelector('[data-vnext-page="today"]',{state:'visible'});
              expect((await page.locator('.vnext-density-board .vnext-density-metric').count())>=10,`${label}: Today restores >=10 dense operating metrics`);
              let ov=await overflow(page);
              expect(Math.max(ov.html,ov.body,ov.root)<=ov.width+1,`${label}: Today document overflow=0`,JSON.stringify(ov));
              let small=await visibleButtonsTooSmall(page);
              expect(small.length===0,`${label}: Today visible buttons >=44px`,JSON.stringify(small));
              await page.screenshot({path:`artifacts/mobile-density/${engine}-${viewport.width}x${viewport.height}-today.png`,fullPage:true});

              for(const module of businessModules){
                await page.click(`[data-vnext-module="${module}"]`);
                await page.waitForSelector(`[data-density-module="${module}"]`,{state:'visible',timeout:5000});
                expect((await page.locator('[data-vnext-page="search"]:visible').count())===0,`${label}/${module}: real module page, not Search fallback`);
                ov=await overflow(page);
                expect(Math.max(ov.html,ov.body,ov.root)<=ov.width+1,`${label}/${module}: document overflow=0`,JSON.stringify(ov));
                small=await visibleButtonsTooSmall(page);
                expect(small.length===0,`${label}/${module}: visible buttons >=44px`,JSON.stringify(small));
              }

              await page.click('[data-vnext-module="ads"]');
              await page.waitForSelector('[data-density-module="ads"]',{state:'visible'});
              const adsAll=await page.locator('[data-density-module="ads"] [data-density-detail-type="campaign"]').count();
              const over45=page.locator('[data-density-filter-module="ads"][data-density-filter="acos45"]');
              expect(await over45.count()===1,`${label}: Ads ACOS >45% functional tag exists`);
              await over45.click();
              await page.waitForTimeout(80);
              expect(await over45.evaluate(el=>el.classList.contains('active')),`${label}: Ads filter tag becomes active`);
              const adsFiltered=await page.locator('[data-density-module="ads"] [data-density-detail-type="campaign"]').count();
              expect(adsFiltered<=adsAll,`${label}: Ads filter changes/retains bounded result set`,`${adsAll}->${adsFiltered}`);

              await page.click('[data-vnext-module="products"]');
              await page.waitForSelector('[data-density-module="products"]',{state:'visible'});
              expect((await page.locator('[data-density-filter-module="products"]').count())===5,`${label}: Products exposes 5 functional filter tags`);
              await page.click('[data-density-filter-module="products"][data-density-filter="buyBox"]');
              expect(await page.locator('[data-density-filter-module="products"][data-density-filter="buyBox"]').evaluate(el=>el.classList.contains('active')),`${label}: Products Buy Box tag activates`);

              await page.click('[data-vnext-module="inventory"]');
              await page.waitForSelector('[data-density-module="inventory"]',{state:'visible'});
              expect((await page.locator('[data-density-filter-module="inventory"]').count())===5,`${label}: Inventory exposes 5 functional filter tags`);
              await page.click('[data-density-filter-module="inventory"][data-density-filter="unsellable"]');
              expect(await page.locator('[data-density-filter-module="inventory"][data-density-filter="unsellable"]').evaluate(el=>el.classList.contains('active')),`${label}: Inventory unsellable tag activates`);

              await page.click('[data-vnext-module="ads"]');
              await page.click('[data-density-filter-module="ads"][data-density-filter="all"]');
              const firstRecord=page.locator('[data-density-module="ads"] [data-density-detail-type="campaign"]').first();
              if(await firstRecord.count()){
                await firstRecord.click();
                await page.waitForSelector('.vnext-detail-screen',{state:'visible'});
                expect((await page.locator('#vnextDetailTitle').textContent()||'').trim().length>0,`${label}: business record opens base vNext detail`);
                await page.goBack();
                await page.waitForSelector('[data-density-module="ads"]',{state:'visible'});
                expect((await page.locator('.vnext-detail-screen').count())===0,`${label}: Back restores same Ads module`);
              }

              await page.click('[data-vnext-module="finance"]');
              await page.waitForSelector('[data-density-module="finance"]',{state:'visible'});
              await page.goBack();
              await page.waitForTimeout(100);
              expect((await page.locator('[data-density-module="finance"]').count())===0,`${label}: Back leaves business module history layer`);

              const unexpectedResponses=badResponses.filter(row=>!(row.status===404&&row.url.endsWith('/api/health')));
              const expected404=badResponses.filter(row=>row.status===404&&row.url.endsWith('/api/health')).length;
              const generic404Console=consoleErrors.filter(message=>message.includes('Failed to load resource')&&message.includes('404')).length;
              const unexpectedConsole=consoleErrors.filter(message=>!(message.includes('Failed to load resource')&&message.includes('404')));
              expect(apiRequests.every(row=>row.method==='GET'),`${label}: browser API remains GET-only`,JSON.stringify(apiRequests));
              expect(unexpectedResponses.length===0,`${label}: no unexpected HTTP >=400`,JSON.stringify(unexpectedResponses));
              expect(unexpectedConsole.length===0&&generic404Console===expected404,`${label}: no unexpected console errors`,JSON.stringify(consoleErrors));
              expect(pageErrors.length===0,`${label}: page errors=0`,JSON.stringify(pageErrors));
              expect(requestFailures.length===0,`${label}: request failures=0`,JSON.stringify(requestFailures));

              await page.screenshot({path:`artifacts/mobile-density/${engine}-${viewport.width}x${viewport.height}-final.png`,fullPage:true});
              report.push({engine,viewport,runtimeMode:runtime.mode,apiRequests,badResponses,requestFailures,pageErrors,consoleErrors});
            }catch(error){
              failures.push(`${label}: ${error.stack||error}`);
              console.error(`FAIL  ${label}`,error);
              await page.screenshot({path:`artifacts/mobile-density/${engine}-${viewport.width}x${viewport.height}-failure.png`,fullPage:true}).catch(()=>{});
            }finally{
              await context.close(); await browser.close();
            }
          }

          async function desktopSmoke(){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await context.newPage();
            await page.goto(base,{waitUntil:'load',timeout:30000});
            await page.waitForTimeout(500);
            const snapshot=await page.evaluate(()=>({
              mobileHidden:document.getElementById('mobileAppRoot')?.hidden,
              mobileActive:document.body.classList.contains('mobile-vnext-active'),
              densityRail:document.querySelectorAll('.vnext-module-rail').length,
              nav:[...document.querySelectorAll('#mainNav [data-page]')].map(node=>node.dataset.page)
            }));
            expect(snapshot.mobileHidden===true&&!snapshot.mobileActive,'desktop 1440: mobile remains inactive',JSON.stringify(snapshot));
            expect(snapshot.densityRail===0,'desktop 1440: density rail absent');
            expect(snapshot.nav.join('|')==='overview|finance|charges|ads|products|inventory|returns|history|data','desktop 1440: 9 desktop destinations unchanged',JSON.stringify(snapshot.nav));
            await context.close(); await browser.close();
          }

          for(const viewport of [{width:393,height:852},{width:430,height:932}]){
            await run('chromium',chromium,viewport);
            await run('webkit',webkit,viewport);
          }
          await desktopSmoke();
          fs.writeFileSync('artifacts/mobile-density/report.json',JSON.stringify(report,null,2));
          if(failures.length){console.error(`\n${failures.length} failure(s)`);failures.forEach((failure,index)=>console.error(`${index+1}. ${failure}`));process.exit(1)}
          console.log('\nDense Mobile Business Acceptance PASS');
          EOF
          node .tmp-density-acceptance.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-density-${{ github.sha }}
          path: artifacts/mobile-density
