name: Hotfix Import Period Acceptance

on:
  push:
    branches:
      - hotfix/production-no-demo-fallback2

permissions:
  contents: read

env:
  WORKERS_CI: '1'
  WORKERS_CI_BRANCH: main
  WORKERS_CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and release gates
        run: |
          node --check public/import-auto-period.js
          node --check public/production-data-guard.js
          npm install --no-audit --no-fund
          npm run check:release:static
      - name: Wrangler production dry-run
        run: npx wrangler deploy --dry-run
      - name: Prepare system Chrome
        run: |
          npm install --no-save --ignore-scripts playwright-core
          test -x /usr/bin/google-chrome || test -x /usr/bin/google-chrome-stable
          echo '127.0.0.1 truth.local' | sudo tee -a /etc/hosts
      - name: Browser acceptance
        run: |
          python3 -m http.server 8788 --directory public >/tmp/hotfix-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : '/usr/bin/google-chrome-stable';
          const base = 'http://truth.local:8788';
          const fingerprints = ['$63,496', '$39,870', '3,295', 'YS005', '63,496', '39,870'];
          const file = (name, text) => ({ name, mimeType: 'text/csv', buffer: Buffer.from(text) });
          const bundle = month => [
            file('联合报告.csv', `settlement id,date/time,product sales\n1,${month}-15,100\n2,${month}-20,50\n`),
            file('广告每日视图.csv', `广告活动名称,7天总销售额,日期\nA,100,${month}-10\nB,50,${month}-11\n`),
            file('退货报告.csv', `return-date,sku,reason\n${month}-08,SKU1,OTHER\n`),
            file('采购成本.csv', 'SKU,采购成本\nSKU1,10\n'),
            file('父体业务报告.csv', 'x\n1\n'),
            file('商品信息.csv', 'x\n1\n'),
            file('FBA库存.csv', 'x\n1\n'),
            file('月度仓储费.csv', 'x\n1\n'),
            file('子体业务报告.csv', 'x\n1\n')
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath });

            for (const viewport of [{width:1440,height:1000},{width:393,height:852}]) {
              const page = await browser.newPage({ viewport });
              const pageErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#ytStoreSwitcher', { timeout: 15000 });
              await page.waitForTimeout(1200);
              const truth = await page.evaluate(fps => {
                const body = document.body.innerText;
                return {
                  dataTruth: document.documentElement.dataset.dataTruth || '',
                  fingerprints: fps.filter(x => body.includes(x)),
                  studioVisible: body.includes('经营智能战情室') || body.includes('经营模型已同步'),
                  storeOptions: [...document.querySelectorAll('#ytStoreSwitcher option')].map(o => o.textContent.trim())
                };
              }, fingerprints);
              if (truth.dataTruth !== 'live-only') throw new Error(`${viewport.width}: production truth guard inactive`);
              if (truth.fingerprints.length) throw new Error(`${viewport.width}: demo fingerprints visible ${truth.fingerprints.join(',')}`);
              if (truth.studioVisible) throw new Error(`${viewport.width}: demo-only studio visible`);
              if (JSON.stringify(truth.storeOptions) !== JSON.stringify(['YTDBNS','YY','JJ'])) throw new Error(`${viewport.width}: store catalog mismatch`);
              if (pageErrors.length) throw new Error(`${viewport.width}: page errors ${pageErrors.join(' | ')}`);
              await page.close();
            }

            const page = await browser.newPage({ viewport: { width: 862, height: 1800 } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('#ytStoreSwitcher', { timeout: 15000 });
            await page.waitForTimeout(1200);
            await page.click('#topImportBtn');
            await page.waitForSelector('#importDrawer.show');

            const drawer = await page.evaluate(() => ({
              visibleMonthInputs: [...document.querySelectorAll('#importDrawer input[type="month"]')].filter(el => getComputedStyle(el).display !== 'none').length,
              hiddenMonthType: document.querySelector('#importMonth')?.type,
              steps: [...document.querySelectorAll('#importDrawer .import-step b')].map(el => el.textContent.trim()),
              autoText: document.querySelector('#importPeriodDetail')?.textContent || ''
            }));
            if (drawer.visibleMonthInputs !== 0 || drawer.hiddenMonthType !== 'hidden') throw new Error('manual month control still visible');
            if (JSON.stringify(drawer.steps) !== JSON.stringify(['加入月度源文件','自动识别报告月份','检查并写入'])) throw new Error(`import step sequence mismatch ${JSON.stringify(drawer.steps)}`);
            if (!drawer.autoText.includes('自动判定月份')) throw new Error('automatic month explanation missing');

            await page.setInputFiles('#importFiles', bundle('2026-07'));
            await page.waitForFunction(() => document.querySelector('#importMonth')?.value === '2026-07' && !document.querySelector('#validateBtn')?.disabled, null, { timeout: 15000 });
            const detected = await page.evaluate(() => ({
              month: document.querySelector('#importMonth')?.value,
              value: document.querySelector('#importPeriodValue')?.textContent.trim(),
              detail: document.querySelector('#importPeriodDetail')?.textContent.trim(),
              state: document.querySelector('#importPeriodStatus')?.dataset.state
            }));
            if (detected.month !== '2026-07' || detected.value !== '2026年7月' || detected.state !== 'ready') throw new Error(`correct bundle month inference failed ${JSON.stringify(detected)}`);
            await page.screenshot({ path: '/tmp/import-period-862-ready.png', fullPage: true });

            const conflict = bundle('2026-07');
            conflict[1] = file('广告每日视图.csv', '广告活动名称,7天总销售额,日期\nA,100,2026-08-10\nB,50,2026-08-11\n');
            await page.setInputFiles('#importFiles', conflict);
            await page.waitForFunction(() => document.querySelector('#importPeriodStatus')?.dataset.state === 'error', null, { timeout: 15000 });
            const mismatch = await page.evaluate(() => ({
              month: document.querySelector('#importMonth')?.value,
              disabled: document.querySelector('#validateBtn')?.disabled,
              value: document.querySelector('#importPeriodValue')?.textContent.trim(),
              detail: document.querySelector('#importPeriodDetail')?.textContent.trim()
            }));
            if (mismatch.month !== '' || !mismatch.disabled || mismatch.value !== '无法确定月份' || !mismatch.detail.includes('报表月份不一致')) throw new Error(`mixed-month bundle was not blocked ${JSON.stringify(mismatch)}`);
            if (pageErrors.length) throw new Error(`862: page errors ${pageErrors.join(' | ')}`);
            await page.screenshot({ path: '/tmp/import-period-862-mismatch.png', fullPage: true });
            await page.close();
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-import-period-${{ github.sha }}
          path: /tmp/import-period-*.png
