name: Mobile A5 Apply Patch

on:
  push:
    branches:
      - mobile-a5-period-sheet-reload

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal A5 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mobile = Path('public/mobile/mobile-vnext.js')
          text = mobile.read_text()
          old = """    const payload = history.state?.[HISTORY_KEY];
              if (payload?.tab && TABS.some(([id]) => id === payload.tab)) state.tab = payload.tab;
              else replaceHistory({ tab: state.tab, detailKey: null, sheet: null });
              render();
              runtime.start();
          """.replace('          ', '')
          new = """    const payload = history.state?.[HISTORY_KEY];
              if (payload?.tab && TABS.some(([id]) => id === payload.tab)) {
                state.tab = payload.tab;
                state.sheet = payload.sheet === 'period' ? 'period' : null;
              } else {
                state.sheet = null;
                replaceHistory({ tab: state.tab, detailKey: null, sheet: null });
              }
              render();
              if (state.sheet === 'period') {
                requestAnimationFrame(() => root.querySelector('.vnext-sheet [data-vnext-close-sheet]')?.focus());
              }
              runtime.start();
          """.replace('          ', '')
          if old in text:
              mobile.write_text(text.replace(old, new, 1))
          elif "state.sheet = payload.sheet === 'period' ? 'period' : null" not in text:
              raise SystemExit('Expected mobile-vnext activation block not found')

          workflow = Path('.github/workflows/ui-integrity.yml')
          text = workflow.read_text()
          syntax_old = '          node --check scripts/mobile-a4-detail-history-acceptance.mjs\n'
          syntax_new = syntax_old + '          node --check scripts/mobile-a5-period-sheet-reload-acceptance.mjs\n'
          if 'node --check scripts/mobile-a5-period-sheet-reload-acceptance.mjs' not in text:
              if syntax_old not in text:
                  raise SystemExit('Expected A4 syntax gate not found')
              text = text.replace(syntax_old, syntax_new, 1)

          step_old = """      - name: Mobile A4 detail-history Chromium acceptance
                  run: node scripts/mobile-a4-detail-history-acceptance.mjs
          """.replace('          ', '')
          step_new = step_old + """      - name: Mobile A5 period-sheet Reload Chromium acceptance
                  run: node scripts/mobile-a5-period-sheet-reload-acceptance.mjs
          """.replace('          ', '')
          if 'Mobile A5 period-sheet Reload Chromium acceptance' not in text:
              if step_old not in text:
                  raise SystemExit('Expected A4 browser gate not found')
              text = text.replace(step_old, step_new, 1)

          artifact_old = '            artifacts/mobile-a4-detail-history\n'
          artifact_new = artifact_old + '            artifacts/mobile-a5-period-sheet-reload\n'
          if 'artifacts/mobile-a5-period-sheet-reload' not in text:
              if artifact_old not in text:
                  raise SystemExit('Expected A4 artifact path not found')
              text = text.replace(artifact_old, artifact_new, 1)
          workflow.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "A5 patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mobile/mobile-vnext.js .github/workflows/ui-integrity.yml
          git commit -m "Mobile A5: restore period sheet across Reload (#65)"
          git push origin HEAD:mobile-a5-period-sheet-reload
