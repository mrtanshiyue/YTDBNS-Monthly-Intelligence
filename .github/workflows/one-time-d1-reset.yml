name: One-time Production D1 Reset

on:
  push:
    branches: [main]
    paths:
      - 'src/worker-entry.js'
      - '.github/workflows/one-time-d1-reset.yml'

permissions:
  contents: read
  id-token: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=ytdbns-production-d1-reset")"
          token="$(jq -r '.value' <<<"$response")"
          test -n "$token"
          test "$token" != "null"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Reset Production D1 business data
        shell: bash
        env:
          RESET_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          endpoint='https://ytdbns-monthly-intelligence.tanshiyuesir.workers.dev/api/__ops/one-time-reset'
          rm -f reset-result.json
          for attempt in $(seq 1 36); do
            status="$(curl -sS -o reset-result.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${RESET_TOKEN}" "$endpoint" || true)"
            if [ "$status" = "200" ]; then
              cat reset-result.json
              jq -e '.ok == true and ([.after[]] | all(. == 0)) and (.preserved.schema == true) and (.preserved.migrations == true) and (.preserved.r2 == true) and (.preserved.stores | length == 3)' reset-result.json
              exit 0
            fi
            sleep 5
          done
          echo "Reset endpoint did not become ready" >&2
          cat reset-result.json 2>/dev/null || true
          exit 1

      - name: Upload reset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-d1-reset-evidence
          path: reset-result.json
          if-no-files-found: ignore
          retention-days: 3
