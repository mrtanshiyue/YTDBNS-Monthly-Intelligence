name: True Multi File Import Acceptance

on:
  push:
    branches:
      - fix/true-multi-file-import

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Static and deployment gates
        run: |
          node --check public/multi-file-import.js
          npm run check:release:static
          npx wrangler deploy --dry-run
      - name: Prepare local D1
        run: npm run db:migrate:local
      - name: Install Chromium
        run: npx playwright-core install chromium
      - name: Start local Worker
        run: |
          nohup npx wrangler dev --local --port 8787 > /tmp/multi-file-wrangler.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/multi-file-wrangler.log
          exit 1
      - name: Chromium true multi-file import acceptance
        run: |
          mkdir -p artifacts/multi-file-import
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const ads1 = '\uFEFF广告组合名称,广告活动名称,日期,总成本,购买量,销售额,展示量,点击量\nP1,C1,2025年6月2日,10.50,2,30.00,100,5\n';
          const ads2 = '\uFEFF广告组合名称,广告活动名称,日期,总成本,购买量,销售额,展示量,点击量\nP1,C1,2025年6月16日,12.25,3,45.00,120,7\n';
          const returns = 'return-date,sku,reason,quantity,detailed-disposition\n2025-06-20,SKU-1,UNWANTED_ITEM,2,SELLABLE\n';
          const trace = [];
          const checkpoint = (name, data = {}) => {
            trace.push({ name, data, at: new Date().toISOString() });
            fs.writeFileSync('artifacts/multi-file-import/trace.json', JSON.stringify(trace, null, 2));
          };

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 960 } });
          try {
            checkpoint('browser-launched');
            await page.goto('http://127.0.0.1:8787', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => Boolean(window.YT_MULTI_FILE_IMPORT));
            checkpoint('runtime-loaded');
            await page.locator('#topImportBtn').click();
            await page.locator('#importFiles').setInputFiles([
              { name: 'ads-part-1.csv', mimeType: 'text/csv', buffer: Buffer.from(ads1, 'utf8') },
              { name: 'ads-part-2.csv', mimeType: 'text/csv', buffer: Buffer.from(ads2, 'utf8') },
              { name: 'returns.csv', mimeType: 'text/csv', buffer: Buffer.from(returns, 'utf8') }
            ]);
            checkpoint('files-selected', await page.evaluate(() => window.YT_MULTI_FILE_IMPORT.getSnapshot()));
            await page.locator('#importPeriodValue').filter({ hasText: '2025年6月' }).waitFor({ state: 'visible' });
            checkpoint('month-detected', { month: await page.locator('#importPeriodValue').textContent() });
            await page.locator('#validateBtn').click();
            await page.locator('#validationBox').filter({ hasText: '3 个 · 全部将单独归档' }).waitFor({ state: 'visible' });
            await page.locator('#validationBox').filter({ hasText: '广告每日视图 × 2' }).waitFor({ state: 'visible' });

            const snapshot = await page.evaluate(() => window.YT_MULTI_FILE_IMPORT.getSnapshot());
            checkpoint('validated', snapshot);
            assert.equal(snapshot.selectedFileCount, 3);
            assert.equal(snapshot.validatedFileCount, 3);
            assert.equal(snapshot.sourceCount, 2);
            assert.deepEqual(snapshot.roles, ['ads', 'ads', 'returns']);
            assert.equal(snapshot.normalized.monthly.adSpend, 22.75);
            assert.equal(snapshot.normalized.monthly.adSales, 75);
            assert.equal(snapshot.normalized.monthly.adOrders, 5);
            assert.equal(snapshot.normalized.monthly.impressions, 220);
            assert.equal(snapshot.normalized.monthly.clicks, 12);
            assert.equal(snapshot.normalized.monthly.returns, 2);

            await page.locator('#commitBtn').click();
            checkpoint('commit-clicked');
            await page.waitForTimeout(2200);

            const logsResponse = await page.request.get('http://127.0.0.1:8787/api/operation-logs?store=ytdbns&limit=30');
            const logsPayload = await logsResponse.json();
            checkpoint('logs-read', { status: logsResponse.status(), logs: logsPayload.logs || [] });
            assert.equal(logsResponse.ok(), true);
            const logs = logsPayload.logs || [];
            const commit = logs.find(log => log.event_type === 'IMPORT_COMMITTED');
            assert.ok(commit, 'IMPORT_COMMITTED log missing');
            assert.equal(commit.detail.fileCount, 3);
            assert.equal(commit.detail.sourceCount, 2);
            assert.equal(commit.detail.sourceFiles.length, 3);
            assert.deepEqual(commit.detail.sourceFiles.map(file => file.filename).sort(), ['ads-part-1.csv', 'ads-part-2.csv', 'returns.csv']);

            const importsResponse = await page.request.get('http://127.0.0.1:8787/api/imports?store=ytdbns');
            const importsPayload = await importsResponse.json();
            checkpoint('imports-read', { status: importsResponse.status(), batches: importsPayload.batches || [] });
            assert.equal(importsResponse.ok(), true);
            const batch = (importsPayload.batches || [])[0];
            assert.ok(batch, 'import batch missing');
            assert.equal(Number(batch.file_count), 3);
            assert.equal(Number(batch.source_count), 2);
            checkpoint('pass');
          } catch (error) {
            fs.writeFileSync('artifacts/multi-file-import/error.txt', String(error?.stack || error));
            try {
              const ui = await page.evaluate(() => ({
                month: document.querySelector('#importPeriodValue')?.textContent,
                validation: document.querySelector('#validationBox')?.textContent,
                commit: document.querySelector('#commitBtn')?.textContent,
                snapshot: window.YT_MULTI_FILE_IMPORT?.getSnapshot?.()
              }));
              fs.writeFileSync('artifacts/multi-file-import/ui-state.json', JSON.stringify(ui, null, 2));
            } catch {}
            throw error;
          } finally {
            try { await page.screenshot({ path: 'artifacts/multi-file-import/true-multi-file-import.png', fullPage: true }); } catch {}
            await browser.close();
          }
          console.log('True multi-file import browser/API acceptance: PASS');
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-multi-file-import-${{ github.sha }}
          path: artifacts/multi-file-import
          if-no-files-found: warn
          retention-days: 7
