name: Production Data Truth Acceptance

on:
  push:
    branches:
      - hotfix/production-no-demo-fallback2

permissions:
  contents: read

env:
  WORKERS_CI: '1'
  WORKERS_CI_BRANCH: main
  WORKERS_CI_COMMIT_SHA: ${{ github.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check public/production-data-guard.js
          node --check public/studio.js
          node --check public/engine.js
      - name: Install and release gates
        run: |
          npm install --no-audit --no-fund
          npm run check:release:static
      - name: Wrangler production dry-run
        run: npx wrangler deploy --dry-run
      - name: Install browser engines
        run: |
          npx playwright install --with-deps chromium webkit
          echo '127.0.0.1 truth.local' | sudo tee -a /etc/hosts
      - name: Production-mode truth browser acceptance
        run: |
          python3 -m http.server 8788 --directory public >/tmp/truth-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium, webkit } = require('playwright');
          const base = 'http://truth.local:8788';
          const fingerprints = ['$63,496', '$39,870', '3,295', 'YS005', '63,496', '39,870'];
          (async()=>{
            for (const [name, engine] of [['chromium', chromium], ['webkit', webkit]]) {
              const browser = await engine.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              const pageErrors=[];
              page.on('pageerror', e => pageErrors.push(String(e)));
              await page.goto(base, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await page.waitForSelector('#ytStoreSwitcher', { timeout: 15000 });
              await page.waitForTimeout(1800);
              const result = await page.evaluate((fps) => {
                const body = document.body.innerText;
                return {
                  dataTruth: document.documentElement.dataset.dataTruth || '',
                  fingerprints: fps.filter(x => body.includes(x)),
                  studioVisible: body.includes('经营智能战情室') || body.includes('日销售热力与节奏') || body.includes('经营模型已同步'),
                  salesText: document.querySelector('.executive-card.primary .executive-value')?.textContent?.trim() || '',
                  inventoryText: [...document.querySelectorAll('.executive-card')].find(el => el.textContent.includes('库存资金'))?.querySelector('.executive-value')?.textContent?.trim() || '',
                  storeOptions: [...document.querySelectorAll('#ytStoreSwitcher option')].map(o => o.textContent.trim())
                };
              }, fingerprints);
              console.log(name, JSON.stringify(result));
              if (result.dataTruth !== 'live-only') throw new Error(`${name}: production truth guard inactive`);
              if (result.fingerprints.length) throw new Error(`${name}: demo fingerprints visible: ${result.fingerprints.join(',')}`);
              if (result.studioVisible) throw new Error(`${name}: demo-only studio still visible`);
              if (JSON.stringify(result.storeOptions) !== JSON.stringify(['YTDBNS','YY','JJ'])) throw new Error(`${name}: store catalog mismatch`);
              if (pageErrors.length) throw new Error(`${name}: page errors: ${pageErrors.join(' | ')}`);
              await page.screenshot({ path: `/tmp/${name}-truth.png`, fullPage: true });
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-data-truth-${{ github.sha }}
          path: |
            /tmp/chromium-truth.png
            /tmp/webkit-truth.png
