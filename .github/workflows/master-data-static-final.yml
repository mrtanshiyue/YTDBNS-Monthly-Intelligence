name: Master Data Static Final
on:
  push:
    branches: [fix/master-data-import-period]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check:release:static
      - run: npx wrangler deploy --dry-run
