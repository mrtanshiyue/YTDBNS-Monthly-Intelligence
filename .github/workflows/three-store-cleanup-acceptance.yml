name: Three Store Cleanup Acceptance

on:
  push:
    branches:
      - three-store-reset-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check public/engine.js
          node --check src/worker-entry.js
          node --check src/worker.js
      - name: Install + release gates
        run: npm install --no-audit --no-fund
      - name: Explicit release gates
        run: npm run check:release:static
      - name: Permanent isolation assertions
        run: |
          set -euo pipefail
          grep -F "body.storeId = storeId" src/worker-entry.js
          grep -F "body.payload.storeId = storeId" src/worker-entry.js
          grep -F "form.set('storeId', storeId)" src/worker-entry.js
          ! grep -F "RESET_KEY" src/worker-entry.js
          ! grep -F "clearRawReports" src/worker-entry.js
          ! grep -F "DELETE FROM" src/worker-entry.js
          ! grep -F "RAW_REPORTS" src/worker-entry.js
          test ! -f migrations/0002_seed_legacy_history.sql
          grep -F "('ytdbns', 'YTDBNS', 'YTDBNS'" migrations/0004_three_store_catalog.sql
          grep -F "('yy', 'YY', 'YY'" migrations/0004_three_store_catalog.sql
          grep -F "('jj', 'JJ', 'JJ'" migrations/0004_three_store_catalog.sql
      - name: Fresh local D1 migration acceptance
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply ytdbns-monthly-db --local
          npx wrangler d1 execute ytdbns-monthly-db --local --command "SELECT id,code,name FROM stores ORDER BY CASE id WHEN 'ytdbns' THEN 1 WHEN 'yy' THEN 2 WHEN 'jj' THEN 3 ELSE 9 END;" | tee /tmp/stores.txt
          grep -F 'ytdbns' /tmp/stores.txt
          grep -F 'yy' /tmp/stores.txt
          grep -F 'jj' /tmp/stores.txt
          ! grep -F 'yt-us' /tmp/stores.txt
      - name: Wrangler production dry-run
        env:
          WORKERS_CI: '1'
          WORKERS_CI_BRANCH: main
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: npx wrangler deploy --dry-run --outdir artifacts/three-store-cleanup
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-store-cleanup-${{ github.sha }}
          path: artifacts/three-store-cleanup
          if-no-files-found: ignore
          retention-days: 7
