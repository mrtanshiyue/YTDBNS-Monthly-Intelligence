name: Production Data Completeness Diagnostic

on:
  push:
    branches:
      - 'diagnostic/data-completeness-production'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Production data history
        env:
          BASE_URL: https://ytdbns-monthly-intelligence.tanshiyuesir.workers.dev
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/api/periods?store=yt-us" -o /tmp/periods.json
          curl -fsS "$BASE_URL/api/imports?store=yt-us" -o /tmp/imports.json

          echo '=== ALL PERIODS ==='
          jq '[.periods[] | {month,business_sales,finance_gross_sales,ad_spend,ad_sales,contribution_profit,model_status,batch_status,updated_at}]' /tmp/periods.json

          echo '=== ALL IMPORT BATCHES ==='
          jq '[.batches[] | {id,status,report_month,range_start,range_end,file_count,source_count,stored_files,created_at,committed_at}]' /tmp/imports.json

          echo '=== MONTH DETAIL COVERAGE ==='
          for month in $(jq -r '.periods[].month' /tmp/periods.json); do
            if curl -fsS "$BASE_URL/api/month?store=yt-us&month=$month" -o /tmp/month.json; then
              jq -c --arg month "$month" '{month:$month, products:(.products|length), parents:(.parents|length), campaigns:(.campaigns|length), returns:(.returns|length), quality:(.quality|length), charges:(.charges|length), inventory:(.inventory|length), inventorySnapshotDate, metrics:{business_sales:.metrics.business_sales,business_units:.metrics.business_units,sessions:.metrics.sessions,finance_gross_sales:.metrics.finance_gross_sales,ad_spend:.metrics.ad_spend,ad_sales:.metrics.ad_sales,inventory_value:.metrics.inventory_value,fulfillable_units:.metrics.fulfillable_units}}' /tmp/month.json
            fi
          done

          echo 'PRODUCTION_DATA_HISTORY_DIAGNOSTIC=PASS'
