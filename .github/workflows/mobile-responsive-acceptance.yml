name: Mobile Responsive Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-responsive-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/ytdbns-http.log 2>&1 &
          echo $! > /tmp/ytdbns-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ytdbns-http.log
          exit 1

      - name: Run responsive acceptance
        run: node scripts/mobile-responsive-acceptance.mjs

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-responsive-acceptance
          path: artifacts/mobile-responsive
          if-no-files-found: warn
