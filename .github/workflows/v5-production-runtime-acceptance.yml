name: V5 Production Runtime Acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install

      - name: Confirm Chromium executable
        run: |
          which google-chrome || which google-chrome-stable || which chromium || which chromium-browser

      - name: Run V5 Production exact-tree Chromium acceptance
        env:
          ACCEPTANCE_URL: https://ytdbns-monthly-intelligence.tanshiyuesir.workers.dev/
          ACCEPTANCE_ARTIFACTS: artifacts/v5-production-final
        run: node scripts/v5-native-mobile-final-acceptance.mjs
