name: P1 Null Metric Bootstrap

on:
  push:
    branches:
      - fix/p1-null-metric-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/apply-p1-null-metric-patch.py
      - name: Verify patch
        run: |
          node scripts/p1-null-metric-semantics-check.mjs
          node --check src/worker.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix: preserve unavailable metric semantics'
          git push origin HEAD:fix/p1-null-metric-semantics
