name: Partial Import Browser Acceptance

on:
  push:
    branches:
      - feature/partial-report-import-v2

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare runtime
        run: |
          npm install --no-audit --no-fund
          npm run db:migrate:local
          npx wrangler dev --local --port 8787 > /tmp/partial-worker.log 2>&1 &
          echo $! > /tmp/partial-worker.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/partial-worker.log
          exit 1
      - name: Single-report browser regression
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require('playwright-core');
          const fs = require('fs');
          const executablePath = fs.existsSync('/usr/bin/google-chrome') ? '/usr/bin/google-chrome' : '/usr/bin/google-chrome-stable';
          const file = (name,text) => ({name,mimeType:'text/csv',buffer:Buffer.from(text)});
          (async()=>{
            const browser = await chromium.launch({headless:true,executablePath});
            const page = await browser.newPage({viewport:{width:862,height:1800}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8787',{waitUntil:'commit',timeout:30000});
            await page.waitForSelector('#ytStoreSwitcher',{timeout:20000});
            await page.waitForSelector('#topImportBtn',{timeout:20000});
            await page.waitForTimeout(900);
            await page.click('#topImportBtn');
            await page.waitForSelector('#importDrawer.show',{timeout:10000});

            await page.setInputFiles('#importFiles', [file('退货报告.csv','return-date,sku,reason,quantity,detailed-disposition\n2026-06-05,A,JUNE,1,SELLABLE\n2026-07-12,B,JULY,2,DAMAGED\n2026-08-03,C,AUGUST,3,SELLABLE\n')]);
            await page.waitForFunction(()=>document.querySelector('#importMonth')?.value,{timeout:15000});
            await page.click('#validateBtn');
            await page.waitForFunction(()=>document.querySelector('#validationBox .validation-line') && document.querySelector('#sourceCount')?.textContent.includes('1 类') && !document.querySelector('#commitBtn')?.disabled,{timeout:15000});
            const returnsState = await page.evaluate(()=>({
              count:document.querySelector('#sourceCount')?.textContent.trim(),
              note:document.querySelector('#ytPartialImportNote')?.textContent.trim(),
              disabled:document.querySelector('#commitBtn')?.disabled,
              validation:document.querySelector('#validationBox')?.textContent.trim(),
              month:document.querySelector('#importMonth')?.value
            }));
            console.log(`RETURNS ${JSON.stringify(returnsState)}`);
            if (returnsState.count !== '1 类' || returnsState.disabled || !returnsState.note.includes('单个报表也可') || !returnsState.validation.includes('可独立写入')) throw new Error(`single returns UX failed: ${JSON.stringify(returnsState)}`);

            await page.setInputFiles('#importFiles', [file('采购成本.csv','SKU,采购成本,更新日期\nSKU1,10,2026-07-02\nSKU2,12,2026-07-15\n')]);
            await page.waitForFunction(()=>document.querySelector('#importMonth')?.value==='2026-07',{timeout:15000});
            await page.click('#validateBtn');
            await page.waitForFunction(()=>document.querySelector('#sourceCount')?.textContent.includes('1 类') && !document.querySelector('#commitBtn')?.disabled,{timeout:15000});
            const costState = await page.evaluate(()=>({
              count:document.querySelector('#sourceCount')?.textContent.trim(),
              month:document.querySelector('#importMonth')?.value,
              period:document.querySelector('#importPeriodValue')?.textContent.trim(),
              disabled:document.querySelector('#commitBtn')?.disabled,
              validation:document.querySelector('#validationBox')?.textContent.trim()
            }));
            console.log(`COST ${JSON.stringify(costState)}`);
            if (costState.count !== '1 类' || costState.month !== '2026-07' || costState.disabled || !costState.validation.includes('可独立写入')) throw new Error(`single cost UX failed: ${JSON.stringify(costState)}`);

            if (errors.length) throw new Error(`page errors: ${errors.join(' | ')}`);
            await page.screenshot({path:'artifacts/partial-import.png',fullPage:true});
            await browser.close();
            console.log('PARTIAL IMPORT BROWSER ACCEPTANCE: PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partial-import-browser-${{ github.sha }}
          path: artifacts/partial-import.png
          retention-days: 7
